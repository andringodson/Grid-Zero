<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Grid Zero: a realistic open-wheel racing game that runs in your browser." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grid Zero" />
    <title>Grid Zero</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" class="loading" role="status" aria-live="polite">
      <div class="loading-mark"><span class="loading-bar"></span>GRID <b>ZERO</b></div>
      <div class="loading-line"><span></span></div>
      <div class="loading-text">LOADING CIRCUIT</div>
    </div>
    <div class="rotate-hint" role="alert">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
        <rect x="18" y="6" width="28" height="52" rx="5" />
        <line x1="28" y1="51" x2="36" y2="51" />
      </svg>
      <div>Turn your phone sideways to race</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
